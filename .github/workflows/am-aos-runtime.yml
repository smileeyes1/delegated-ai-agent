name: AM-AOS Runtime Gate

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Runtime tests
        run: python -m pytest -q tests/test_am_aos_runtime.py
