name: Autonomous Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - 'book/**'
      - '.github/workflows/autonomous-orchestrator.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: autonomous-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Inspect durable state
        run: |
          test -f book/FACTORY_STATE.json
          test -f book/CHAPTER_01_STATE.json
          python3 - <<'PY'
          import json
          for p in ['book/FACTORY_STATE.json','book/CHAPTER_01_STATE.json']:
              d=json.load(open(p, encoding='utf-8'))
              print(p, d.get('status'), d.get('next_action'))
          PY

      - name: Run deterministic integrity checks
        run: |
          python3 book/VERIFY.py || true
          python3 book/CHAPTER_01_VERIFY.py || true
          python3 book/e2e_runner.py

      - name: Persist heartbeat and next-action decision
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          p='book/AUTONOMOUS_HEARTBEAT.json'
          d={
            'timestamp': datetime.now(timezone.utc).isoformat(),
            'status': 'alive',
            'mode': 'autonomous',
            'next_action': 'replace_fixture_with_verified_research_adapter',
            'human_prompt_required': False,
            'note': 'Heartbeat proves scheduler execution only; scholarly completion requires evidence-backed runtime proof.'
          }
          open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book/AUTONOMOUS_HEARTBEAT.json
          git diff --cached --quiet || git commit -m 'Record autonomous factory heartbeat'
          git push
