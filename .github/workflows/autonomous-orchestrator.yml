name: Autonomous Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - 'book/**'
      - '.github/workflows/autonomous-orchestrator.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: autonomous-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Inspect durable state
        run: |
          test -f book/FACTORY_STATE.json
          test -f book/CHAPTER_01_STATE.json
          python3 - <<'PY'
          import json
          for p in ['book/FACTORY_STATE.json','book/CHAPTER_01_STATE.json']:
              d=json.load(open(p, encoding='utf-8'))
              print(p, d.get('status'), d.get('next_action'))
          PY

      - name: Run integrity and autonomous dispatch
        run: |
          python3 book/VERIFY.py || true
          python3 book/CHAPTER_01_VERIFY.py || true
          python3 book/e2e_runner.py
          python3 book/AUTONOMOUS_DISPATCH.py

      - name: Persist autonomous checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book/AUTONOMOUS_DISPATCH_DECISION.json book/CHAPTER_01_STATE.json book/research_data/chapter_01_autonomous_research.json book/research_data/chapter_01_research_draft.md book/research_data/tanzil-uthmani.txt
          git diff --cached --quiet || git commit -m 'Checkpoint autonomous research dispatch'
          git push
