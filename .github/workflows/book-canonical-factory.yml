name: Book Canonical Factory

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: book-canonical-factory
  cancel-in-progress: false

jobs:
  factory:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Strict preflight
        shell: bash
        run: |
          set -euo pipefail
          for f in VERIFY.py CHAPTER_01_VERIFY.py e2e_runner.py META_CONTROLLER.py AUTONOMOUS_DISPATCH.py CHAPTER_01_AUTONOMOUS_PIPELINE.py CHAPTER_01_CRITIC.py ADVANCE_CHAPTER_STATE.py RELEASE_CHECK.py; do test -f "book/$f"; done

      - name: Integrity
        run: python3 book/VERIFY.py

      - name: Chapter verification
        run: python3 book/CHAPTER_01_VERIFY.py

      - name: End-to-end proof
        run: python3 book/e2e_runner.py --output "$RUNNER_TEMP/book-e2e-proof.json"

      - name: Meta control
        run: python3 book/META_CONTROLLER.py

      - name: Execute selected research task
        shell: bash
        run: |
          set -euo pipefail
          python3 book/CHAPTER_01_AUTONOMOUS_PIPELINE.py

      - name: Independent critique
        run: python3 book/CHAPTER_01_CRITIC.py

      - name: Advance only if gates permit
        run: python3 book/ADVANCE_CHAPTER_STATE.py

      - name: Persist verified research checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book
          if git diff --cached --quiet; then
            echo 'NO_REAL_STATE_CHANGE'
            exit 0
          fi
          git commit -m 'Advance canonical autonomous book factory'
          bash book/push_checkpoint.sh "$GITHUB_REF_NAME" 1

      - name: Release gate
        run: python3 book/RELEASE_CHECK.py
