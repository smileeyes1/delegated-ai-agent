name: Compile Book Agentic Workflow

on:
  push:
    paths:
      - ".github/workflows/book-autonomous.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: book-agent-compile
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gh-aw
        run: gh extension install github/gh-aw

      - name: Compile agentic workflow
        run: gh aw compile .github/workflows/book-autonomous.md --strict

      - name: Commit compiled lock file
        run: |
          if git diff --quiet -- .github/workflows/book-autonomous.lock.yml; then
            echo "Lock file is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/book-autonomous.lock.yml
          git commit -m "chore: compile book agent workflow"
          git push
