name: Book E2E Proof

on:
  push:
    paths:
      - 'book/**'
      - '.github/workflows/book-e2e-proof.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: book-e2e-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic factory proof
        run: python3 book/e2e_runner.py
      - name: Verify artifact
        run: |
          test -s book/runs/latest_e2e_smoke.json
          python3 - <<'PY'
          import json
          p='book/runs/latest_e2e_smoke.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['passed'] is True
          assert d['draft']['status'] == 'fixture_draft'
          assert d['next_task'] == 'replace_fixture_with_verified_research_adapter'
          print('E2E proof: PASS')
          PY
      - name: Checkpoint proof artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book/runs/latest_e2e_smoke.json
          git diff --cached --quiet || git commit -m 'Record book factory E2E proof'
          git push
