name: Book E2E Proof

on:
  push:
    paths:
      - 'book/**'
      - '.github/workflows/book-e2e-proof.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: book-e2e-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run deterministic factory proof
        run: python3 book/e2e_runner.py --output "$RUNNER_TEMP/book-e2e-proof.json"
      - name: Verify artifact
        run: |
          test -s "$RUNNER_TEMP/book-e2e-proof.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP']) / 'book-e2e-proof.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['passed'] is True
          assert d['draft']['status'] == 'fixture_draft'
          assert d['next_task'] == 'replace_fixture_with_verified_research_adapter'
          print('E2E proof: PASS')
          PY
      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-e2e-proof
          path: ${{ runner.temp }}/book-e2e-proof.json
          if-no-files-found: error
          retention-days: 14
