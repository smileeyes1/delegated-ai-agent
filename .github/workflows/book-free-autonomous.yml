name: Book Free Autonomous Research (manual legacy)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bounded research manually
        run: python3 book/free_autonomous_research.py
      - name: Validate output
        run: |
          set -euo pipefail
          test -s book/STATE.json
          test -s book/FREE_QUEUE.json
