name: Book Free Autonomous Runner

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - 'book/**'
      - '.github/workflows/book-free-runner.yml'
  workflow_dispatch:

concurrency:
  group: book-free-runner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preflight state and queue
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          state=json.loads(Path('book/STATE.json').read_text(encoding='utf-8'))
          q=json.loads(Path('book/FREE_QUEUE.json').read_text(encoding='utf-8'))
          assert state.get('project') == 'كتاب'
          assert state.get('scholarly_status') == 'exploratory_unverified'
          assert isinstance(q,list) and q
          print('run=' + ('true' if any(x.get('status') == 'pending' for x in q) else 'false'))
          PY

      - name: Deterministic self-audit
        run: python3 book/SELF_AUDIT.py

      - name: Choose next task deterministically
        if: steps.pending.outputs.run == 'true'
        run: python3 book/RESEARCH_ORCHESTRATOR.py

      - name: Cache Ollama model
        if: steps.pending.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen2.5-0.5b-v2

      - name: Install Ollama and start local inference
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ollama >/dev/null 2>&1; then curl -fsSL https://ollama.com/install.sh | sh; fi
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do ollama list >/dev/null 2>&1 && break; sleep 2; done
          ollama pull qwen2.5:0.5b

      - name: Process bounded research units
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            echo "=== autonomous unit $n/4 ==="
            python3 book/free_autonomous_research.py | tee /tmp/book-run.log
            if grep -q '^RETRY_REQUIRED$' /tmp/book-run.log; then
              echo 'Retryable blocker; preserving task for a later run.'
              break
            fi
            if grep -q 'No pending tasks' /tmp/book-run.log; then break; fi
          done

      - name: Deterministic quality gate
        run: python3 book/QUALITY_GATE.py

      - name: Final self-audit
        run: python3 book/SELF_AUDIT.py

      - name: Persist verified state transition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'book-autonomous-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book/
          if git diff --cached --quiet; then
            echo 'No repository changes.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'book: autonomous research progress [skip ci]'
          git push
