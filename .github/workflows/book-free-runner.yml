name: Book Autonomous Factory — Canonical

on:
  push:
    paths:
      - 'book/**'
      - '.github/workflows/book-free-runner.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: book-canonical-factory
  cancel-in-progress: false

env:
  GIT_PUSH_RETRIES: '5'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Master terminal gate
        run: python3 book/MASTER_TERMINAL_GATE.py
      - name: Discover missing work across the full lifecycle
        run: python3 book/PROJECT_COMPLETENESS_AUDIT.py
      - name: Preflight state and queue
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          state=json.loads(Path('book/STATE.json').read_text(encoding='utf-8'))
          q=json.loads(Path('book/FREE_QUEUE.json').read_text(encoding='utf-8'))
          assert state.get('project') == 'كتاب'
          assert isinstance(q,list) and q
          runnable = any(x.get('status') in {'pending','evidence_collected'} for x in q)
          print('run=' + ('true' if runnable else 'false'))
          PY
      - name: Deterministic self-audit
        run: python3 book/SELF_AUDIT.py
      - name: Choose next task
        if: steps.pending.outputs.run == 'true'
        run: python3 book/RESEARCH_ORCHESTRATOR.py
      - name: Cache local models
        if: steps.pending.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-book-models-v3
      - name: Install Ollama and prepare fallback model ladder
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ollama >/dev/null 2>&1; then curl -fsSL https://ollama.com/install.sh | sh; fi
          ollama serve > /tmp/ollama.log 2>&1 &
          ready=0
          for i in $(seq 1 45); do
            if ollama list >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -eq 1 ]; then
            ollama pull qwen2.5:3b || echo 'MODEL_3B_UNAVAILABLE_RETRYABLE'
            ollama pull qwen2.5:1.5b || echo 'MODEL_1_5B_UNAVAILABLE_RETRYABLE'
            ollama pull qwen2.5:0.5b || echo 'MODEL_0_5B_UNAVAILABLE_RETRYABLE'
          else
            echo 'OLLAMA_UNAVAILABLE_RETRYABLE'
          fi
      - name: Process bounded research units
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            echo "=== autonomous unit $n/4 ==="
            python3 book/free_autonomous_research.py | tee /tmp/book-run.log
            if grep -Eq 'RETRY_REQUIRED|EVIDENCE_COLLECTED_RETRYABLE|No pending or evidence-collected tasks' /tmp/book-run.log; then break; fi
          done
      - name: Persist evidence checkpoint when synthesis is blocked
        id: evidence_checkpoint
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'EVIDENCE_COLLECTED_RETRYABLE' /tmp/book-run.log; then
            git config user.name 'book-autonomous-agent'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add book/
            if git diff --cached --quiet; then
              echo 'evidence_checkpoint=false' >> "$GITHUB_OUTPUT"
            else
              git diff --cached --check
              git commit -m 'book: persist verified evidence acquisition checkpoint [skip ci]'
              for attempt in $(seq 1 "$GIT_PUSH_RETRIES"); do
                git fetch origin main
                git rebase origin/main || { git rebase --abort || true; git reset --soft origin/main; git commit -m 'book: persist verified evidence acquisition checkpoint [skip ci]'; }
                if git push origin HEAD:main; then
                  echo 'evidence_checkpoint=true' >> "$GITHUB_OUTPUT"
                  break
                fi
                if [ "$attempt" -eq "$GIT_PUSH_RETRIES" ]; then exit 1; fi
                sleep $((attempt * 3))
              done
            fi
          else echo 'evidence_checkpoint=false' >> "$GITHUB_OUTPUT"; fi
      - name: Verify research and durable state
        if: steps.pending.outputs.run == 'true' && steps.evidence_checkpoint.outputs.evidence_checkpoint != 'true'
        run: |
          python3 book/VERIFY.py
          python3 book/CHAPTER_01_VERIFY.py
          python3 book/e2e_runner.py
      - name: Meta-control and task dispatch
        if: steps.pending.outputs.run == 'true' && steps.evidence_checkpoint.outputs.evidence_checkpoint != 'true'
        run: |
          python3 book/META_CONTROLLER.py
          python3 book/AUTONOMOUS_DISPATCH.py
      - name: Critique and gated state advancement
        if: steps.pending.outputs.run == 'true' && steps.evidence_checkpoint.outputs.evidence_checkpoint != 'true'
        run: |
          python3 book/CHAPTER_01_CRITIC.py
          python3 book/ADVANCE_CHAPTER_STATE.py
          python3 book/RELEASE_CHECK.py
      - name: Final self-audit
        run: python3 book/SELF_AUDIT.py
      - name: Persist verified checkpoint
        if: steps.evidence_checkpoint.outputs.evidence_checkpoint != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'book-autonomous-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book/
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m 'book: canonical autonomous factory checkpoint [skip ci]'
          for attempt in $(seq 1 "$GIT_PUSH_RETRIES"); do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; git reset --soft origin/main; git commit -m 'book: canonical autonomous factory checkpoint [skip ci]'; }
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq "$GIT_PUSH_RETRIES" ]; then exit 1; fi
            sleep $((attempt * 3))
          done
      - name: Failure is explicit
        if: failure()
        run: echo 'CANONICAL_FACTORY_CYCLE_FAILED — durable state explains the block; next scheduled cycle resumes from the last valid checkpoint.'
