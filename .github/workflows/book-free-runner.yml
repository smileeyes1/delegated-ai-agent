name: Book Autonomous Factory — Canonical

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - '.github/workflows/book-free-runner.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: book-canonical-factory
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify starting checkpoint
        run: |
          python3 book/MASTER_TERMINAL_GATE.py
          python3 book/SELF_AUDIT.py
          python3 book/validate_research.py
          python3 book/QUALITY_GATE.py
      - name: Discover missing work across the full lifecycle
        run: python3 book/PROJECT_COMPLETENESS_AUDIT.py
      - name: Acquire one candidate evidence checkpoint without a model
        run: python3 book/free_autonomous_research.py --evidence-only
      - name: Verify resulting checkpoint
        run: |
          python3 book/SELF_AUDIT.py
          python3 book/validate_research.py
          python3 book/QUALITY_GATE.py
      - name: Persist verified checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'book-autonomous-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book/
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m 'book: canonical evidence checkpoint [skip ci]'
          bash book/push_checkpoint.sh "$GITHUB_REF_NAME" 5
      - name: Failure is explicit
        if: failure()
        run: echo 'CANONICAL_FACTORY_CYCLE_FAILED — next scheduled cycle resumes from the last valid checkpoint.'
