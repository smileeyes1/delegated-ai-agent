name: Book Free Autonomous Runner

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: book-free-runner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen2.5-0.5b-v1

      - name: Install Ollama
        shell: bash
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 20); do
            ollama list >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Ensure small local model
        run: ollama pull qwen2.5:0.5b

      - name: Run one research unit
        run: python3 book/free_autonomous_research.py

      - name: Validate state and queue
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('book/STATE.json').read_text(encoding='utf-8'))
          queue=json.loads(Path('book/FREE_QUEUE.json').read_text(encoding='utf-8'))
          assert state.get('project') == 'كتاب'
          assert isinstance(queue, list) and queue
          assert all(x.get('status') in {'pending','processed'} for x in queue)
          print('state=', state.get('status'), 'next=', state.get('next_task'))
          PY

      - name: Commit autonomous progress
        shell: bash
        run: |
          git config user.name 'book-autonomous-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book/
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'book: autonomous research progress [skip ci]'
          git push
