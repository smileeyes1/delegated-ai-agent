name: Book Autonomous Self-Heal

on:
  workflow_run:
    workflows: ["Book Free Autonomous Runner"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  heal:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - name: Retry the failed run once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: gh run rerun "$RUN_ID" --failed --repo "$REPO"
