name: Continuous Book Factory

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: continuous-book-factory
  cancel-in-progress: false

jobs:
  continue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run factory cycle
        shell: bash
        run: |
          set -euo pipefail
          python3 book/VERIFY.py
          python3 book/CHAPTER_01_VERIFY.py
          python3 book/e2e_runner.py
          python3 book/META_CONTROLLER.py
          python3 book/AUTONOMOUS_DISPATCH.py
          python3 book/CHAPTER_01_CRITIC.py
          python3 book/ADVANCE_CHAPTER_STATE.py
          python3 book/RELEASE_CHECK.py

      - name: Checkpoint every real state change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book
          if git diff --cached --quiet; then
            echo 'NO_STATE_CHANGE'
            exit 0
          fi
          git commit -m 'Advance autonomous book factory checkpoint'
          git push

      - name: Failure is visible
        if: failure()
        run: |
          echo 'FACTORY_CYCLE_FAILED: next scheduled run must resume from durable state.'
          exit 1
