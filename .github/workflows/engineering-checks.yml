name: Engineering checks

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'app/**'
      - 'book/**'
      - 'factories/**'
      - 'interop/**'
      - 'tests/**'
  pull_request:
  schedule:
    - cron: '29 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure local media tools are available
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe || ! test -r /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes ffmpeg fonts-dejavu-core
          fi
      - name: Run offline regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Check repository and book fixture
        run: |
          python3 -m compileall -q app book factories interop tests
          bash -n book/push_checkpoint.sh
          python3 book/VERIFY.py
          python3 book/MASTER_TERMINAL_GATE.py
          python3 book/SELF_AUDIT.py
          python3 book/validate_research.py
          python3 book/QUALITY_GATE.py
          python3 book/free_autonomous_research.py --audit
          python3 book/e2e_runner.py --output "$RUNNER_TEMP/book-e2e-proof.json"
          git diff --exit-code
