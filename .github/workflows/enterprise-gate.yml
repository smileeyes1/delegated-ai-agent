name: enterprise-gate

on:
  push:
    branches: ["main", "feat/enterprise-azure-foundry-gate"]
  pull_request:
    branches: ["main"]

jobs:
  gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run enterprise gate tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Evaluate example manifest
        run: python app/enterprise_gate.py
