name: Hakim isolated event proof
on:
  push:
    branches: ['hakim/event-engine-test']
    paths: ['hakim_event/**', '.github/workflows/hakim-event-proof.yml']
permissions:
  contents: read
concurrency:
  group: hakim-event-proof
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run acceptance tests
        id: acceptance
        run: python3 -m unittest discover -s hakim_event -v
      - name: Report acceptance outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.acceptance.outcome }}
        run: |
          state=failure
          if [ "$OUTCOME" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="hakim/event-proof" -f description="Isolated acceptance: $OUTCOME" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
