name: Hakim isolated event proof
on:
  push:
    branches: ['hakim/event-engine-test']
    paths: ['hakim_event/**', '.github/workflows/hakim-event-proof.yml']
permissions:
  contents: read
concurrency:
  group: hakim-event-proof
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run acceptance tests
        id: acceptance
        run: python3 -m unittest discover -s hakim_event -v
      - name: Produce verified worksheet
        id: product
        run: |
          PYTHONPATH=hakim_event python3 - <<'PY'
          from test_math_product import questions, render
          from pathlib import Path
          import hashlib
          q=questions()
          assert len(q)==6 and all(x['n']==10*x['tens']+x['ones'] for x in q)
          p=Path('delivery/math.html')
          p.parent.mkdir(exist_ok=True)
          p.write_text(render(q),encoding='utf-8')
          assert p.read_text(encoding='utf-8')==render(q)
          p.with_suffix('.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  math.html\n')
          PY
      - uses: actions/upload-artifact@v4
        id: delivery
        with:
          name: hakim-math-worksheet
          path: delivery/
          retention-days: 7
          if-no-files-found: error
      - name: Report acceptance outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.acceptance.outcome }}
          DELIVERY: ${{ steps.delivery.outcome }}
        run: |
          state=failure
          if [ "$OUTCOME" = success ] && [ "$DELIVERY" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="hakim/event-proof" -f description="Tests: $OUTCOME; delivery: $DELIVERY" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
