name: Deploy HAKIM trial page
on:
  push:
    branches: [feat/enterprise-azure-foundry-gate]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static app
        run: |
          set -e
          mkdir -p docs
          cp index.html hakim-engine.js hakim-validator.js hakim-orchestrator.js hakim-game.js docs/
          cp hakim-quality-test.html docs/
          test -s docs/index.html
          test -s docs/hakim-orchestrator.js
          grep -q 'HAKIM_ORCHESTRATOR' docs/hakim-orchestrator.js
          grep -q 'HAKIM_VALIDATOR' docs/hakim-validator.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
