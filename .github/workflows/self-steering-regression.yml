name: HAKIM Self-Steering Regression

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  governance-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run self-steering regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify governance contract is present
        run: test -s governance/SELF_STEERING_ENGINEERING_CONTRACT_vΩ.md
