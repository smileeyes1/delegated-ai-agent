<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAKIM Ω — Quality Gate Test</title><style>body{font-family:system-ui;max-width:900px;margin:auto;padding:20px;background:#f5f7fa}section{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin:12px 0}button{padding:11px 16px;border:0;border-radius:10px;background:#111827;color:#fff}.ok{color:#087f5b}.bad{color:#b42318}.mono{font-family:monospace;direction:ltr;text-align:left;white-space:pre-wrap}</style><h1>HAKIM Ω — Quality Gate</h1><p>اختبار حواجز التكرار والرياضيات والمحتوى قبل التصدير.</p><button id="run">تشغيل الاختبارات</button><main id="out"></main><script src="hakim-engine.js"></script><script src="hakim-validator.js"></script><script>
const cases=[
{name:'تكرار الكتل',text:'## الهدف\nيتعرف الطفل على العدد ٤.\n---\n## النشاط\nيعد الطفل ٤ أشياء.\n---\n## النشاط\nيعد الطفل ٤ أشياء.\n---\n## النشاط\nيعد الطفل ٤ أشياء.',wantRepair:true},
{name:'معادلة صحيحة',text:'## العدد ٣\nنشاط تعليمي مناسب للصف الأول.\n٣ + ٤ = ٧',wantPass:true},
{name:'معادلة خاطئة',text:'## العدد ٣\nنشاط تعليمي مناسب للصف الأول.\n٣ + ٤ = ٨',wantPass:false},
{name:'أرقام لاتينية في الرياضيات',text:'## العدد ٣\nنشاط تعليمي مناسب للصف الأول.\n3 + 4 = 7',wantPass:false},
{name:'محتوى فارغ',text:'',wantPass:false}
];
function run(){const out=document.getElementById('out');out.innerHTML='';let n=0;for(const c of cases){const g=HAKIM_VALIDATOR.validate(c.text,{long:true});const pass=c.wantRepair?(g.ok&&g.repaired):c.wantPass?g.ok:!g.ok;n+=pass?1:0;const d=document.createElement('section');d.innerHTML='<b>'+c.name+'</b><div class="'+(pass?'ok':'bad')+'">'+(pass?'PASS':'FAIL')+'</div><div class="mono">'+(g.errors.length?g.errors.join(' • '):'لا أخطاء')+'</div>'+(g.repaired?'<p class="ok">تمت إزالة التكرار تلقائيًا قبل التصدير.</p>':'');out.appendChild(d)}const s=document.createElement('section');s.innerHTML='<h2>'+n+' / '+cases.length+'</h2><p class="'+(n===cases.length?'ok':'bad')+'">'+(n===cases.length?'ALL TESTS PASS — GO':'TEST FAILURE — NO-GO')+'</p>';out.prepend(s)}
document.getElementById('run').onclick=run;run();
</script></html>
