<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAKIM Ω</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f7fa;color:#17202a}main{max-width:820px;margin:auto;padding:24px}header{background:#fff;border:1px solid #e1e6eb;border-radius:20px;padding:22px;margin-bottom:16px}h1{margin:0 0 6px}p{margin:6px 0;color:#667085}textarea{width:100%;min-height:170px;padding:16px;border:1px solid #cbd5e1;border-radius:16px;font:inherit;background:#fff}button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;background:#111827;color:#fff;font:inherit;font-weight:700}section{margin-top:16px;background:#fff;border:1px solid #e1e6eb;border-radius:16px;padding:16px;min-height:120px;white-space:pre-wrap}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2f7;font-size:13px}</style></head>
<body><main><header><span class="badge">HAKIM Ω</span><h1>حكيم</h1><p>المساعد التعليمي الذكي — نسخة ويب خفيفة</p></header><textarea id="q" placeholder="اكتب ما تريد من حكيم… مثل: أنشئ لي نشاطًا للصف الأول عن الجمع ضمن ١٠"></textarea><button id="ask">اسأل حكيم</button><section id="out">جاهز لاستقبال طلبك.</section></main><script>const q=document.getElementById('q'),o=document.getElementById('out'),b=document.getElementById('ask');b.onclick=()=>{const v=q.value.trim();if(!v){o.textContent='اكتب طلبك أولًا.';return}o.textContent='تم استلام طلبك.\n\nهذه نسخة الواجهة المنشورة. محرك الذكاء الحي يُوصل عبر Backend آمن حتى لا تُكشف مفاتيح المزودات داخل المتصفح.'};</script></body></html>
