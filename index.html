<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAKIM Ω — الاستوديو التعليمي</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f7fa;color:#17202a}main{max-width:980px;margin:auto;padding:18px}.top{background:#111827;color:#fff;border-radius:22px;padding:22px;margin-bottom:14px}.top h1{margin:4px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid #e1e6eb;border-radius:20px;padding:18px;margin-bottom:14px}label{display:block;font-weight:700;margin-bottom:8px}textarea,select,input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:13px;font:inherit;background:#fff}textarea{min-height:170px;resize:vertical}button{padding:12px 15px;border:0;border-radius:12px;background:#111827;color:#fff;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.result{white-space:pre-wrap;line-height:1.85;overflow-wrap:anywhere;max-height:none}.muted{color:#667085;font-size:13px}.badge{display:inline-block;background:#eef2f7;color:#17202a;padding:5px 9px;border-radius:99px;font-size:12px}.ok{background:#ecfdf3}.fail{background:#fff1f2}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tabs button{background:#fff;color:#17202a;border:1px solid #d7dde5;white-space:nowrap}.tabs button.active{background:#111827;color:#fff}.hidden{display:none}.filegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(max-width:700px){.grid,.filegrid{grid-template-columns:1fr}main{padding:10px}.top,.card{border-radius:16px}}
</style></head><body><main><header class="top"><span class="badge">HAKIM Ω</span><h1>حكيم — الاستوديو التعليمي</h1><div>ذكاء إنترنت مجاني + إنتاج موارد + تحقق + تصدير خفيف على الجهاز</div></header>
<div class="tabs"><button class="active" data-tab="ask">المساعد</button><button data-tab="produce">مصنع الموارد</button></div>
<section id="ask" class="card"><label>ماذا تريد من حكيم؟</label><textarea id="q" placeholder="مثال: أنشئ درسًا كاملًا للصف الأول عن العدد ٢ مع نشاط وتقويم وورقة عمل."></textarea><button id="askBtn">اسأل حكيم</button><div id="status" class="muted" style="margin-top:10px">المسار: Primary → Retry → Failover → Fail-closed</div></section>
<section id="produce" class="card hidden"><div class="grid"><div><label>نوع المورد</label><select id="kind"><option value="lesson">درس كامل</option><option value="worksheet">ورقة عمل</option><option value="game">لعبة تفاعلية</option><option value="assessment">تقويم تفاعلي</option><option value="pack">حزمة تعليمية</option></select></div><div><label>الصف</label><select id="grade"><option>الصف الأول</option><option>الصف الثاني</option></select></div></div><label style="margin-top:14px">المطلوب</label><textarea id="rq" placeholder="مثال: العدد ٢، مدة ٤٥ دقيقة، هدف واحد، نشاط واحد، تقييم سريع."></textarea><div class="actions"><button id="generate">ولّد المورد</button></div><div id="rstatus" class="muted" style="margin-top:10px">سيُستخدم الذكاء ثم محرك الإنتاج المحلي.</div></section>
<section class="card"><div class="actions"><button id="html" disabled>⬇ HTML تفاعلي</button><button id="pdf" disabled>🖨 حفظ كـ PDF</button><button id="json" disabled>⬇ JSON</button><button id="txt" disabled>⬇ TXT</button></div><div id="out" class="result" style="margin-top:14px">جاهز.</div><div id="meta" class="muted" style="margin-top:10px">لا نموذج محلي • لا مفتاح في المتصفح • لا خدمة مدفوعة</div></section></main>
<script src="hakim-engine.js"></script><script>
const q=document.getElementById('q'),out=document.getElementById('out'),status=document.getElementById('status'),meta=document.getElementById('meta'),askBtn=document.getElementById('askBtn');let current=null;
const system='أنت حكيم HAKIM Ω، مساعد تعليمي عربي دقيق. أجب بالعربية الواضحة. للصفوف الأولى اجعل المحتوى عمليًا وبسيطًا وقابلًا للتطبيق. عند الطلب الطويل أكمل حتى نهاية منطقية ولا تختصر بسبب ضيق المساحة. لا تدّع تنفيذ أدوات أو الوصول إلى ملفات غير متاحة. عند إنشاء مادة رياضيات، حافظ على ترتيبها التعليمي الصريح ولا تعتمد على BiDi لتغيير ترتيب الرموز.';
const routes=[{name:'OVH • GPT-OSS 120B',url:'https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions',model:'gpt-oss-120b'},{name:'OVH • Meta-Llama 3.3 70B',url:'https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions',model:'Meta-Llama-3_3-70B-Instruct'},{name:'OVH • GPT-OSS 20B',url:'https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions',model:'gpt-oss-20b'},{name:'BlockRun • GPT-OSS 120B',url:'https://blockrun.ai/api/v1/chat/completions',model:'nvidia/gpt-oss-120b'},{name:'BlockRun • Step 3.7 Flash',url:'https://blockrun.ai/api/v1/chat/completions',model:'nvidia/step-3.7-flash'}];
const health=new Map,cache=new Map;const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function call(route,messages){const c=new AbortController(),timer=setTimeout(()=>c.abort(),25000);try{const r=await fetch(route.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:route.model,messages,temperature:.25,max_tokens:2400,stream:false}),signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json(),x=d?.choices?.[0];if(!x?.message?.content)throw Error('EMPTY');return {text:x.message.content.trim(),finish:x.finish_reason||''}}finally{clearTimeout(timer)}}
function incomplete(t,finish){return finish==='length'||(!/[.!؟؛:]$/.test(t.trim())&&t.trim().length>900)}
async function longCall(route,prompt){let r=await call(route,[{role:'system',content:system},{role:'user',content:prompt}]),text=r.text,msg=[{role:'system',content:system},{role:'user',content:prompt},{role:'assistant',content:text}];for(let i=0;i<3&&incomplete(text,r.finish);i++){status.textContent=`المسار: ${route.name} — استكمال ${i+1}/3`;r=await call(route,msg.concat([{role:'user',content:'أكمل من آخر نقطة مباشرة حتى النهاية. لا تكرر أي جزء سابق ولا تبدأ من جديد.'}]));text+='\n'+r.text;msg.push({role:'user',content:'أكمل من آخر نقطة مباشرة حتى النهاية. لا تكرر أي جزء سابق ولا تبدأ من جديد.'},{role:'assistant',content:r.text})}return text}
async function ask(prompt){const k=prompt.trim().replace(/\s+/g,' ').toLowerCase(),old=cache.get(k);if(old){meta.textContent='Cache محلي — لم نستهلك طلب AI';return old}for(const r of routes){if(Date.now()-(health.get(r.name)||0)<90000)continue;status.textContent='المسار: '+r.name+' — محاولة مجانية…';try{const text=await longCall(r,prompt);health.delete(r.name);cache.set(k,text);meta.textContent='AI حقيقي عبر الإنترنت — مجاني — '+r.name+' • استكمال تلقائي • Cache';return text}catch(e){health.set(r.name,Date.now());if(String(e.message).includes('429'))await wait(1200)}}throw Error('لا يوجد مزود مجاني متاح حاليًا')}
function show(text,source){try{current=HAKIM_ENGINE.build(text);out.textContent=text;document.querySelectorAll('.actions button').forEach(x=>x.disabled=false);meta.textContent=source+' • تم اجتياز فحص HAKIM الأساسي'}catch(e){current=null;out.textContent=text;meta.textContent='تم توليد النص، لكن محرك التحقق رفض تحويله إلى مورد: '+e.message}}
askBtn.onclick=async()=>{const p=q.value.trim();if(!p)return;askBtn.disabled=true;out.textContent='حكيم يولّد ويتحقق…';try{const t=await ask(p);show(t,meta.textContent)}catch(e){out.textContent=e.message;status.textContent='Fail-closed — لم تُستخدم خدمة مدفوعة'}finally{askBtn.disabled=false}};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('ask').classList.toggle('hidden',b.dataset.tab!=='ask');document.getElementById('produce').classList.toggle('hidden',b.dataset.tab!=='produce')});
document.getElementById('generate').onclick=async()=>{const rq=document.getElementById('rq').value.trim(),g=document.getElementById('grade').value,k=document.getElementById('kind').value;if(!rq)return;const labels={lesson:'درس كامل',worksheet:'ورقة عمل',game:'لعبة تعليمية تفاعلية',assessment:'تقويم تفاعلي',pack:'حزمة تعليمية'};document.getElementById('rstatus').textContent='جاري التخطيط والتوليد والتحقق…';try{const prompt=`أنتج ${labels[k]} لـ${g}. ${rq}\nاجعل الناتج جاهزًا للاستخدام من المعلم، منظمًا بعناوين واضحة، ومناسبًا للصفوف الأولى. إذا كان رياضيات فلا تغيّر الترتيب البصري التعليمي للأعداد والعمليات.`;const t=await ask(prompt);show(t,meta.textContent);document.getElementById('rstatus').textContent='تم التوليد والتحقق الأساسي. يمكنك التصدير الآن.'}catch(e){document.getElementById('rstatus').textContent=e.message}};
document.getElementById('html').onclick=()=>current&&HAKIM_ENGINE.exportHtml(current);document.getElementById('pdf').onclick=()=>current&&HAKIM_ENGINE.printPdf(current);document.getElementById('json').onclick=()=>current&&HAKIM_ENGINE.exportJson(current);document.getElementById('txt').onclick=()=>current&&HAKIM_ENGINE.exportText(current);
</script></body></html>
