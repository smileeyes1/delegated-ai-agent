<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAKIM Ω</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f7fa;color:#17202a}main{max-width:820px;margin:auto;padding:24px}header,section{background:#fff;border:1px solid #e1e6eb;border-radius:20px;padding:20px;margin-bottom:16px}h1{margin:0 0 6px}p{margin:6px 0;color:#667085}textarea{width:100%;min-height:170px;padding:16px;border:1px solid #cbd5e1;border-radius:16px;font:inherit;background:#fff}button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;background:#111827;color:#fff;font:inherit;font-weight:700}button:disabled{opacity:.6}section{white-space:pre-wrap;min-height:120px}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2f7;font-size:13px}.status{font-size:13px}</style></head>
<body><main><header><span class="badge">HAKIM Ω</span><h1>حكيم</h1><p>المساعد التعليمي الذكي — ذكاء إنترنت مجاني، خفيف على الجهاز</p></header><textarea id="q" placeholder="اكتب ما تريد من حكيم… مثل: أنشئ لي نشاطًا للصف الأول عن الجمع ضمن ١٠"></textarea><button id="ask">اسأل حكيم</button><section id="out">جاهز.</section><p class="status" id="status">المسار: Internet AI → مجاني فقط → لا مفاتيح داخل المتصفح</p></main><script>
const ENDPOINTS=[
 'https://victor-qwen3-8-27b-free-endpoint.hf.space/v1/chat/completions',
 'https://victor-qwen3-8-flash-next-free-endpoint.hf.space/v1/chat/completions'
];
const q=document.getElementById('q'),o=document.getElementById('out'),b=document.getElementById('ask'),s=document.getElementById('status');
const system='أنت حكيم HAKIM Ω، مساعد تعليمي عربي دقيق. أجب بالعربية الواضحة. عند تصميم التعليمات للصفوف الأولى اجعلها عملية وبسيطة ومناسبة للمعلم. لا تدّع تنفيذ أدوات أو الوصول إلى ملفات غير متاحة.';
async function call(url,prompt){const c=new AbortController();const t=setTimeout(()=>c.abort(),18000);try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'Qwen3.8-27B',messages:[{role:'system',content:system},{role:'user',content:prompt}],temperature:.3,max_tokens:900,stream:false}),signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();const text=d?.choices?.[0]?.message?.content?.trim();if(!text)throw new Error('EMPTY');return text}finally{clearTimeout(t)}}
async function ask(){const v=q.value.trim();if(!v){o.textContent='اكتب طلبك أولًا.';return}b.disabled=true;o.textContent='حكيم يفكر…';s.textContent='المسار: تجربة مزود إنترنت مجاني…';let last='';for(const u of ENDPOINTS){try{const text=await call(u,v);o.textContent=text;s.textContent='المسار: AI حقيقي عبر الإنترنت — مزود مجاني';b.disabled=false;return}catch(e){last=e.message}}o.textContent='تعذر الوصول إلى مزود الذكاء المجاني الآن. لم يتم استخدام أي خدمة مدفوعة ولم تُرسل مفاتيح من جهازك.';s.textContent='المسار: Fail-closed — لا مزود مجاني متاح حاليًا ('+last+')';b.disabled=false}
b.addEventListener('click',ask);
</script></body></html>
