<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAKIM Ω</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f7fa;color:#17202a}main{max-width:820px;margin:auto;padding:24px}header,section{background:#fff;border:1px solid #e1e6eb;border-radius:20px;padding:20px;margin-bottom:16px}h1{margin:0 0 6px}p{margin:6px 0;color:#667085}textarea{width:100%;min-height:170px;padding:16px;border:1px solid #cbd5e1;border-radius:16px;font:inherit;background:#fff}button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;background:#111827;color:#fff;font:inherit;font-weight:700}button:disabled{opacity:.6}section{white-space:pre-wrap;min-height:120px}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2f7;font-size:13px}.status{font-size:13px}.meta{font-size:12px;color:#667085}</style></head>
<body><main><header><span class="badge">HAKIM Ω</span><h1>حكيم</h1><p>المساعد التعليمي الذكي — شبكة ذكاء إنترنت مجانية وخفيفة</p></header><textarea id="q" placeholder="اكتب ما تريد من حكيم… مثل: أنشئ لي نشاطًا للصف الأول عن الجمع ضمن ١٠"></textarea><button id="ask">اسأل حكيم</button><section id="out">جاهز.</section><p class="status" id="status">المسار: Primary → Retry → Failover → Fail-closed</p><p class="meta" id="meta">لا نموذج محلي • لا مفتاح في المتصفح • لا خدمة مدفوعة</p></main><script>
const q=document.getElementById('q'),o=document.getElementById('out'),b=document.getElementById('ask'),s=document.getElementById('status'),m=document.getElementById('meta');
const system='أنت حكيم HAKIM Ω، مساعد تعليمي عربي دقيق. أجب بالعربية الواضحة. عند تصميم التعليمات للصفوف الأولى اجعلها عملية وبسيطة ومناسبة للمعلم. لا تدّع تنفيذ أدوات أو الوصول إلى ملفات غير متاحة.';
const routes=[
 {name:'OVH • GPT-OSS 120B',url:'https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions',model:'gpt-oss-120b',kind:'openai',primary:true},
 {name:'OVH • Meta-Llama 3.3 70B',url:'https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions',model:'Meta-Llama-3_3-70B-Instruct',kind:'openai'},
 {name:'OVH • GPT-OSS 20B',url:'https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions',model:'gpt-oss-20b',kind:'openai'},
 {name:'BlockRun • GPT-OSS 120B',url:'https://blockrun.ai/api/v1/chat/completions',model:'nvidia/gpt-oss-120b',kind:'openai'},
 {name:'BlockRun • Step 3.7 Flash',url:'https://blockrun.ai/api/v1/chat/completions',model:'nvidia/step-3.7-flash',kind:'openai'},
 {name:'BlockRun • DeepSeek V4 Flash',url:'https://blockrun.ai/api/v1/chat/completions',model:'nvidia/deepseek-v4-flash',kind:'openai'},
 {name:'Pollinations • Mistral',url:'https://text.pollinations.ai/',model:'mistral',kind:'pollinations'}
];
const cache=new Map();const health=new Map();const CACHE_TTL=10*60*1000;const DOWN_TTL=90*1000;
function key(v){return v.trim().replace(/\s+/g,' ').toLowerCase()}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function callOpenAI(route,prompt){const c=new AbortController();const t=setTimeout(()=>c.abort(),18000);try{const r=await fetch(route.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:route.model,messages:[{role:'system',content:system},{role:'user',content:prompt}],temperature:.3,max_tokens:900,stream:false}),signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();const text=d?.choices?.[0]?.message?.content?.trim();if(!text)throw new Error('EMPTY');return text}finally{clearTimeout(t)}}
async function callPollinations(prompt){const c=new AbortController();const t=setTimeout(()=>c.abort(),18000);try{const u='https://text.pollinations.ai/'+encodeURIComponent(prompt)+'?model=mistral&temperature=0.3&system='+encodeURIComponent(system)+'&private=true';const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);const text=(await r.text()).trim();if(!text)throw new Error('EMPTY');return text}finally{clearTimeout(t)}}
async function ask(){const v=q.value.trim();if(!v){o.textContent='اكتب طلبك أولًا.';return}const k=key(v),old=cache.get(k);if(old&&Date.now()-old.time<CACHE_TTL){o.textContent=old.text;s.textContent='المسار: Cache محلي — لم نستهلك طلب AI';m.textContent='النتيجة محفوظة مؤقتًا على جهازك';return}b.disabled=true;o.textContent='حكيم يبحث عن أفضل مسار مجاني…';let errors=[];for(const route of routes){const bad=health.get(route.name);if(bad&&Date.now()-bad<DOWN_TTL)continue;s.textContent='المسار: '+route.name+' — محاولة مجانية…';for(let attempt=0;attempt<2;attempt++){try{const text=route.kind==='pollinations'?await callPollinations(v):await callOpenAI(route,v);cache.set(k,{text,time:Date.now()});health.delete(route.name);o.textContent=text;s.textContent='المسار: AI حقيقي عبر الإنترنت — مجاني — '+route.name;m.textContent='Primary/Failover mesh • Cache مفعّل • لا مفتاح داخل المتصفح';b.disabled=false;return}catch(e){const msg=e?.message||'NETWORK_ERROR';errors.push(route.name+': '+msg);health.set(route.name,Date.now());if(msg.includes('HTTP 429'))await wait(1500)}}}o.textContent='تعذر الوصول إلى أي مزود ذكاء مجاني حاليًا. لم تُستخدم خدمة مدفوعة.';s.textContent='المسار: Fail-closed — جميع المسارات المتاحة فشلت';m.textContent=errors.join(' | ');b.disabled=false}
b.addEventListener('click',ask);
</script></body></html>
