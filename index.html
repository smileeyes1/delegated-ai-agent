<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>HAKIM Ω — الاستوديو التعليمي</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:system-ui,-apple-system,"Noto Naskh Arabic",Tahoma,sans-serif}main{max-width:1000px;margin:auto;padding:12px}.top,.card{background:#fff;border:1px solid #dfe4ea;border-radius:18px;padding:18px;margin-bottom:12px}.top{background:#111827;color:#fff}.top h1{margin:4px 0;font-size:28px}.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:#fff2;color:#fff;font-size:12px}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin-bottom:12px}.tabs button{background:#fff;color:#17202a;border:1px solid #d7dde5}.tabs button.active,button.primary{background:#111827;color:#fff}button{border:0;border-radius:11px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}label{display:block;font-weight:800;margin:8px 0}textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:11px;font:inherit;background:#fff}textarea{min-height:170px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{white-space:pre-wrap;line-height:1.9;overflow-wrap:anywhere;max-height:60vh;overflow:auto}.muted{font-size:13px;color:#667085}.gate{margin-top:10px;padding:10px;border-radius:10px;background:#f1f5f9}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:8px}}</style></head><body><main><header class="top"><span class="badge">HAKIM Ω</span><h1>حكيم — الاستوديو التعليمي</h1><div>ذكاء إنترنت مجاني + إنتاج موارد + تحقق + إصلاح + تصدير احترافي خفيف على الجهاز</div></header><div class="tabs"><button class="active" data-tab="ask">المساعد</button><button data-tab="produce">مصنع الموارد</button></div><section id="ask" class="card"><label>ماذا تريد من حكيم؟</label><textarea id="q" placeholder="أنشئ درسًا للصف الأول عن العدد ٢ بهدف واحد ونشاط واحد وتقييم سريع."></textarea><button id="askBtn" class="primary">اسأل حكيم</button><div id="status" class="muted" style="margin-top:10px">جاهز — فهم → توليد → تحقق → إصلاح → تحقق</div></section><section id="produce" class="card hidden"><div class="grid"><div><label>نوع المورد</label><select id="kind"><option value="lesson">درس كامل</option><option value="worksheet">ورقة عمل</option><option value="game">لعبة تفاعلية</option><option value="assessment">تقويم تفاعلي</option><option value="pack">حزمة تعليمية</option></select></div><div><label>الصف</label><select id="grade"><option>الصف الأول</option><option>الصف الثاني</option></select></div></div><label>المطلوب</label><textarea id="rq" placeholder="الموضوع، الهدف، المدة، القيود أو أي مواصفات."></textarea><button id="generate" class="primary">ولّد المورد</button><div id="rstatus" class="muted" style="margin-top:10px">التخطيط → التوليد → التحقق → الإصلاح → إعادة التحقق</div></section><section class="card"><div class="actions"><button id="html" disabled>⬇ HTML</button><button id="pdf" disabled>🖨 PDF</button><button id="json" disabled>⬇ JSON</button><button id="txt" disabled>⬇ TXT</button><button id="game" disabled>🎮 لعبة</button><button id="pack" disabled>📦 ZIP</button></div><div id="out" class="result" style="margin-top:14px">جاهز.</div><div id="gate" class="gate muted">بوابة الجودة: لم يبدأ التحقق.</div></section></main><script src="hakim-engine.js"></script><script src="hakim-validator.js"></script><script src="hakim-orchestrator.js"></script><script src="hakim-game.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),q=$('q'),out=$('out'),status=$('status'),gate=$('gate'),askBtn=$('askBtn');let current=null,lastSource='';
const system='أنت حكيم HAKIM Ω. أنت مساعد تعليمي مهني للصفوف الأولى في السياق الفلسطيني. افهم الغاية والصف والمادة والسياق قبل الإجابة. أخرج موردًا نهائيًا عمليًا، صحيحًا، واضحًا، غير مكرر، ومناسبًا لعمر المتعلم. للدرس: هدف تعليمي واحد، نشاط رئيسي واحد، تقييم سريع، ومدة ٤٥ دقيقة عند طلب خطة درس. استخدم الأرقام العربية الشرقية. لا تكرر عنوانًا أو فقرة أو ملخصًا. لا تضف أنشطة إضافية أو مفاهيم متقدمة بلا طلب. لا تذكر أنك نموذج ذكاء اصطناعي ولا تضع شرحًا عن طريقة التوليد. لا تدّع استخدام مصدر أو أداة غير متاحة. عند طلب مورد طويل، اجعله منظمًا ومركزًا بدل الحشو. أخرج المورد النهائي فقط.';
const routes=[
{name:'LLM7 • Default',url:'https://api.llm7.io/v1/chat/completions',model:'default'},
{name:'LLM7 • Fast',url:'https://api.llm7.io/v1/chat/completions',model:'fast'},
{name:'OVH • GPT-OSS 120B',url:'https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions',model:'gpt-oss-120b'},
{name:'OVH • Meta-Llama 3.3 70B',url:'https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions',model:'Meta-Llama-3_3-70B-Instruct'},
{name:'OVH • GPT-OSS 20B',url:'https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions',model:'gpt-oss-20b'},
{name:'BlockRun • GPT-OSS 120B',url:'https://blockrun.ai/api/v1/chat/completions',model:'nvidia/gpt-oss-120b'},
{name:'BlockRun • Step 3.7 Flash',url:'https://blockrun.ai/api/v1/chat/completions',model:'nvidia/step-3.7-flash'}];
const health=new Map,cache=new Map,wait=ms=>new Promise(r=>setTimeout(r,ms));
async function call(route,messages,budget=2200){const c=new AbortController(),timer=setTimeout(()=>c.abort(),28000);try{const r=await fetch(route.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:route.model,messages,temperature:.15,max_tokens:budget,stream:false}),signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json(),x=d?.choices?.[0];if(!x?.message?.content)throw Error('EMPTY');return{text:x.message.content.trim(),finish:x.finish_reason||''}}finally{clearTimeout(timer)}}
async function rawAsk(prompt){const key=prompt.trim().replace(/\s+/g,' ').toLowerCase();if(cache.has(key)){lastSource='Cache محلي';return cache.get(key)}for(const route of routes){if(Date.now()-(health.get(route.name)||0)<90000)continue;status.textContent='المسار: '+route.name+' — محاولة مجانية…';try{let r=await call(route,[{role:'system',content:system},{role:'user',content:prompt}]),text=r.text;for(let i=0;i<2&&r.finish==='length';i++){status.textContent=`المسار: ${route.name} — استكمال ${i+1}/2`;r=await call(route,[{role:'system',content:system},{role:'user',content:prompt},{role:'assistant',content:text},{role:'user',content:'أكمل من آخر نقطة فقط. لا تعيد أي نص سابق. لا تضف قسمًا مكررًا. اختم المورد عندما يكتمل.'}],2200);text+='\n'+r.text}health.delete(route.name);cache.set(key,text);lastSource='AI حقيقي عبر الإنترنت — مجاني — '+route.name;return text}catch(e){health.set(route.name,Date.now());if(String(e.message).includes('429'))await wait(1600)}}throw Error('لا يوجد مزود مجاني متاح حاليًا')}
async function obtain(prompt){const first=await rawAsk(prompt),recovery=await HAKIM_ORCHESTRATOR.recover(first,rawAsk);if(!recovery.ok)throw Error('NO-GO — لم يجتز المورد بوابة الجودة: '+recovery.history.at(-1).errors.join(' • '));return recovery}
function show(recovery){const v=HAKIM_VALIDATOR.validate(recovery.text,{long:true});current=null;[$('html'),$('pdf'),$('json'),$('txt'),$('game'),$('pack')].forEach(x=>x.disabled=true);if(!v.ok){out.textContent='لم يُعتمد المورد.';gate.textContent='🔴 NO-GO • '+v.errors.join(' • ');return}try{current=HAKIM_ENGINE.build(v.text)}catch(e){gate.textContent='🔴 NO-GO • Artifact Gate • '+e.message;return}out.textContent=v.text;gate.textContent='🟢 GO • Validator PASS • '+lastSource+(recovery.history.length>1?' • Self-Repair verified':'')+` • ${new Date().toLocaleTimeString('ar')}`;[$('html'),$('pdf'),$('json'),$('txt'),$('game'),$('pack')].forEach(x=>x.disabled=false)}
async function run(prompt){out.textContent='حكيم يعمل: فهم → توليد → فحص → إصلاح → إعادة فحص…';gate.textContent='🟡 قيد التحقق';try{show(await obtain(prompt))}catch(e){out.textContent=e.message;gate.textContent='🔴 Fail-closed — لا خدمة مدفوعة ولا مفتاح داخل المتصفح';status.textContent='تم إيقاف المسار الآمن.'}}
askBtn.onclick=async()=>{const p=q.value.trim();if(!p)return;askBtn.disabled=true;try{await run(p)}finally{askBtn.disabled=false}};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('ask').classList.toggle('hidden',b.dataset.tab!=='ask');$('produce').classList.toggle('hidden',b.dataset.tab!=='produce')});
$('generate').onclick=async()=>{const rq=$('rq').value.trim();if(!rq)return;const labels={lesson:'درس كامل',worksheet:'ورقة عمل',game:'لعبة تعليمية تفاعلية',assessment:'تقويم تفاعلي',pack:'حزمة تعليمية'};const constraints={lesson:'هدف واحد، نشاط رئيسي واحد، تقييم سريع، ٤٥ دقيقة، دون تكرار.',worksheet:'جاهزة للطباعة A4، تعليمات قصيرة، تدريبات متدرجة، دون حشو.',game:'لعبة فعلية قابلة للتفاعل، هدف واحد، قواعد واضحة، تغذية راجعة فورية.',assessment:'تقويم قصير واضح، أسئلة مناسبة للصف، تصحيح وتغذية راجعة.',pack:'حزمة منظمة ومتماسكة، كل جزء يخدم الهدف، دون تكرار.'};$('rstatus').textContent='جاري التنفيذ الذاتي…';await run(`أنتج ${labels[$('kind').value]} لـ${$('grade').value}. ${rq} القيود الإلزامية: ${constraints[$('kind').value]} أخرج المورد النهائي مركزًا ومكتملًا مرة واحدة، بلا تكرار أو حشو.`);$('rstatus').textContent=current?'تم التحقق ويمكن التصدير.':'NO-GO — لم يعتمد المورد.'};
$('html').onclick=()=>current&&HAKIM_ENGINE.exportHtml(current);$('pdf').onclick=()=>current&&HAKIM_ENGINE.printPdf(current);$('json').onclick=()=>current&&HAKIM_ENGINE.exportJson(current);$('txt').onclick=()=>current&&HAKIM_ENGINE.exportText(current);$('game').onclick=()=>current&&HAKIM_GAME.countGame(current);$('pack').onclick=()=>current&&HAKIM_ENGINE.exportPack(current);
</script></body></html>
