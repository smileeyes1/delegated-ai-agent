<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAKIM Ω Runtime Gate</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:24px;line-height:1.7}pre{white-space:pre-wrap;background:#f4f4f4;padding:16px;border-radius:10px}.ok{font-weight:800}.bad{font-weight:800}button{padding:10px 16px;border:0;border-radius:8px}</style></head><body><h1>HAKIM Ω — Runtime Assurance Gate</h1><p>اختبار مستقل للنسخة المنشورة. لا يعلن نجاح الذكاء الحي؛ يثبت فقط سلامة طبقات المتصفح التي يمكن التحقق منها ذاتيًا.</p><button id="run">تشغيل الاختبار</button><pre id="out">جاهز.</pre><script src="../hakim-engine.js"></script><script src="../hakim-validator.js"></script><script src="../hakim-orchestrator.js"></script><script>const out=document.getElementById('out');const log=[];function ok(n){log.push('PASS  '+n)}function no(n,e){log.push('FAIL  '+n+(e?' — '+e:''))}function assert(c,n){c?ok(n):no(n)}function run(){log.length=0;try{assert(!!window.HAKIM_ENGINE,'Artifact Engine loaded');assert(typeof HAKIM_ENGINE.build==='function','Resource builder');assert(typeof HAKIM_ENGINE.professionalHtml==='function','Professional HTML renderer');assert(typeof HAKIM_ENGINE.exportPack==='function','ZIP pack exporter');assert(typeof HAKIM_ENGINE.printPdf==='function','Print/PDF path');assert(!!window.HAKIM_VALIDATOR,'Validator loaded');assert(typeof HAKIM_VALIDATOR.validate==='function','Validator API');if(window.HAKIM_ORCHESTRATOR){assert(typeof HAKIM_ORCHESTRATOR==='object','Orchestrator loaded')}else ok('Orchestrator optional on legacy runtime');const sample='درس العدد ٥\n\nالهدف: أن يتعرف الطالب إلى العدد ٥ ويعد خمس أشياء.\n\n### نشاط رئيسي\nيعد الطالب خمس قطع أمامه ثم يطابقها مع الرمز ٥.\n\n### تحقق سريع\nيشير الطالب إلى مجموعة فيها خمسة أشياء.';const r=HAKIM_ENGINE.build(sample);assert(r.numerals==='eastern-arabic','Eastern Arabic numeral contract');assert(r.direction==='rtl','RTL contract');const h=HAKIM_ENGINE.professionalHtml(r.title,r.content);assert(/@page\{size:A4/.test(h),'A4 print contract');assert(/dir="rtl"/.test(h),'RTL document contract');assert(h.includes('العدد ٥'),'Arabic sample rendered');let v;try{v=HAKIM_VALIDATOR.validate(sample,{domain:'math',grade:'G1'})}catch(e){v=HAKIM_VALIDATOR.validate(sample)}assert(v&&v.ok===true,'Validator accepts clean sample');const bad='درس العدد 5\n\nالملخص النهائي\nنفس المحتوى.\n\nالملخص النهائي\nنفس المحتوى.';let bv;try{bv=HAKIM_VALIDATOR.validate(bad,{domain:'math',grade:'G1'})}catch(e){bv={ok:false}}assert(bv.ok!==true,'Validator rejects regression sample');}catch(e){no('Runtime gate exception',e.message)}out.textContent=log.join('\n')+'\n\n'+(log.some(x=>x.startsWith('FAIL'))?'NO-GO':'GO: browser-layer checks passed');}document.getElementById('run').onclick=run;run();</script></body></html>
